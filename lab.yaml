# Single source of truth. Networks are a list: each entry is one VNet in its own RG,
# and every layer loops over it. Other sections point at a network/subnet by name.

# Tenant and subscription are in lab.local.yaml (git-ignored), or AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
namePrefix: f2s          # {namePrefix} below is replaced by this; a --env overlay changes it
nameSeed: v1          # change for a second instance
location: swedencentral   # the whole lab; a network or app entry may set its own location to override
tags:
  lab: foundry-to-sre-agent

# Registered on the subscription before anything else (up providers, first layer of up all).
# Safe to re-run; down leaves them registered. Microsoft.BotService is registered by the optional m365 step.
providers:
  - Microsoft.CognitiveServices        # Foundry accounts, projects, model deployments
  - Microsoft.App                      # agent subnet delegation, SRE Agent (Microsoft.App/agents)
  - Microsoft.ApiManagement            # AI gateway
  - Microsoft.Web                      # web app, APIM VNet integration delegation
  - Microsoft.DocumentDB               # Cosmos DB (agent threads)
  - Microsoft.Search                   # AI Search (knowledge, agent files)
  - Microsoft.Storage
  - Microsoft.Network
  - Microsoft.Compute                  # jump host
  - Microsoft.ManagedIdentity
  - Microsoft.Insights                 # App Insights, alerts, diagnostic settings
  - Microsoft.OperationalInsights      # Log Analytics
  - Microsoft.Monitor                  # Azure Monitor workspace (managed Prometheus)
  - Microsoft.AlertsManagement         # Prometheus rule groups
# (the full lab ran on a subscription with only these; add more here if a new layer needs one)

networks:
  - name: foundry
    resourceGroup: rg-{namePrefix}-foundry
    addressSpace: [10.40.0.0/16]
    subnets:
      - name: snet-apim              # APIM Standard v2 outbound integration
        prefix: 10.40.0.0/24
        delegation: Microsoft.Web/serverFarms
        nsgRules:
          - {name: AllowKeyVaultOutbound, priority: 100, direction: Outbound, src: VirtualNetwork, dst: AzureKeyVault, port: "443"}
      - name: snet-agent             # Foundry agent compute (network injection)
        prefix: 10.40.1.0/24
        delegation: Microsoft.App/environments
        nsgRules:
          - {name: AllowEntraIdOutbound, priority: 100, direction: Outbound, src: VirtualNetwork, dst: AzureActiveDirectory, port: "443"}
      - name: snet-pe                # private endpoints
        prefix: 10.40.2.0/24
      - name: snet-jump              # jump host
        prefix: 10.40.3.0/24
        nsgRules:
          # Not 22: a tenant policy strips internet-facing 22 rules. Access is gated by the
          # SSH key; set src to a /32 to lock it down.
          - {name: AllowSshInbound, priority: 100, direction: Inbound, src: &sshSource "*", port: &sshPort "2222"}
    # Zones are created in this network's RG and linked to this VNet.
    dnsZones:
      - privatelink.services.ai.azure.com
      - privatelink.openai.azure.com
      - privatelink.cognitiveservices.azure.com
      - privatelink.blob.core.windows.net
      - privatelink.documents.azure.com
      - privatelink.search.windows.net
      - privatelink.azure-api.net

  - name: sre
    resourceGroup: rg-{namePrefix}-sre
    addressSpace: [10.41.0.0/24]
    subnets:
      # SRE Agent VNet mode: /27 or larger, delegated, used by nothing else. The NAT
      # gives the sandbox outbound internet (ARM, packages); MCP to APIM stays private.
      - name: snet-sre-agent
        prefix: 10.41.0.0/27
        delegation: Microsoft.App/environments
        natGateway: true

  # The external vendor's own network: in the external RG, never peered, no DNS zones.
  # It stands for "somewhere on the internet"; nothing in it reaches the Foundry or SRE VNets.
  - name: vendor
    resourceGroup: rg-{namePrefix}-external
    addressSpace: [10.42.0.0/24]
    subnets:
      - name: snet-vendor
        prefix: 10.42.0.0/27
        nsgRules:
          - {name: AllowSshInbound, priority: 100, direction: Inbound, src: *sshSource, port: *sshPort}

# Links between networks live here, not inside either network.
peerings:
  - between: [sre, foundry]          # both directions are created
    allowForwardedTraffic: false

dnsLinks:                            # a zone owned by one network, linked to another VNet
  - {zone: privatelink.azure-api.net, network: sre}   # SRE Agent -> APIM private endpoint

foundry:
  network: foundry
  agentSubnet: snet-agent
  peSubnet: snet-pe
  project: private-poc
  model:
    name: gpt-5.6-sol
    version: "2026-07-09"
    sku: DataZoneStandard
    capacity: 10
  jump:                              # SOCKS jump host: the laptop's way into the private data planes
    subnet: snet-jump
    sshPort: *sshPort
    sshSource: *sshSource
    vmSize: Standard_D2als_v7
    adminUser: azureuser
    socksPort: 1080

gateway:                             # APIM Standard v2 flagged as AI gateway, private endpoint inbound
  subnet: snet-apim                  # outbound VNet integration
  sku: StandardV2
  publisherEmail: you@example.com
  publisherName: "{namePrefix} lab"
  publicAccess: false                # created Enabled (required), switched off once the PE exists
  product: foundry-gw
  tokenLimitPerMinute: 0             # 0 = no llm-token-limit
  inferenceApiVersion: "2024-10-21"
  logMessages: 32768                 # log prompts + completions (bytes/message) on the model APIs; 0 = off
  logBodies: 8192                    # log request/response bodies on the -sre / -sre-mcp APIs; 0 = off

runtime:                             # Standard agent setup: BYO Cosmos, Storage, Search + capability host
  searchSku: basic                   # basic | standard | serverless (preview, pay per use; check the region offers it)
  capabilityHost: caphostproj

knowledge:                           # Foundry IQ: generated architecture docs -> index -> source -> base
  index: lab-architecture
  source: lab-architecture-ks
  base: lab-architecture-kb

agent:                               # hosted agent (code deploy, remote build), model via the gateway
  name: architect
  source: agents/architect
  cpu: "0.5"
  memory: 1Gi

promptAgent:                         # prompt agent: a definition only (no code, no container), same knowledge,
  name: architect-prompt             # model via the gateway's account connection (key API); side by side with the hosted one
  tool: ask_architect_prompt         # its MCP tool, next to mcp.tool on the same MCP API

mcp:                                  # the agent as an MCP tool on APIM, for the SRE Agent
  tool: ask_architect
  product: sre-mcp
  subscription: sre-agent

app:                                 # the "customer" web app nobody operates: its own RG, mapped to the SRE Agent
  resourceGroup: rg-{namePrefix}-app
  sku: B1
  pythonVersion: "3.12"
  source: app                        # zip-deployed to Kudu; Oryx installs requirements.txt
  http5xxThreshold: 10               # log alert: AppServiceHTTPLogs 5xx count in 5 min
  http5xxSeverity: 1
  responseTimeSeconds: 3             # metric alert: average HttpResponseTime
  responseTimeSeverity: 2

sre:                                 # Azure SRE Agent, injected into the SRE network
  network: sre                       # the agent's region = this network's location
  subnet: snet-sre-agent
  name: sre-{namePrefix}-agent
  accessLevel: High                  # Low = investigate only; High = may act with remediationRoles
  modelProvider: Anthropic           # Anthropic | MicrosoftFoundry
  remediationRoles:                  # granted on app.resourceGroup when accessLevel is High
    Website Contributor: de139f84-1756-47ae-9be6-808fbbe84772
  connector: foundry                 # MCP connector -> mcp.tool; the agent sees foundry_<tool>
  skill: consult-architect           # sre/<skill>.md, bound to the connector tool
  responsePlan:                      # which fired alerts the agent investigates on its own
    id: webapp-alerts
    priorities: [Sev0, Sev1, Sev2]
    agentMode: autonomous
    maxAttempts: 3

external:                            # a resource outside Azure (a vendor API we don't own), pull model:
                                     # our collector on the vendor VM scrapes it into managed Prometheus
  resourceGroup: rg-{namePrefix}-external     # vendor VM, Azure Monitor workspace, rule group; mapped to the SRE Agent
  network: vendor                    # the vendor VM's own VNet (networks above), not the Foundry one
  subnet: snet-vendor
  sshPort: *sshPort                  # `python lab.py vendor` sets the mode over ssh
  adminUser: azureuser
  vmSize: Standard_D2als_v7
  vendor: contoso-payments           # label on every series and in the alert annotations
  vendorContact: support@contoso-payments.example   # who the agent would email (later: Outlook connector)
  exporterPort: 9105                 # fake vendor /metrics on 127.0.0.1 of the vendor VM
  scrapeInterval: 15s
  prometheusVersion: 3.16.0          # agent mode, remote-write with the VM's user-assigned identity
  latencySeconds: 0.5                # alert when vendor_api_latency_seconds stays above this
  errorRatio: 0.05                   # alert when errors/requests over 5 min stays above this
  alertFor: PT2M                     # how long the breach must last before the alert fires
  severity: 2                        # Sev2: inside the response plan's priorities